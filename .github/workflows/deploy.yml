name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Позволяет запустить публикацию вручную кнопкой во вкладке Actions.
  workflow_dispatch:

# Права, которые GitHub выдаёт этому процессу: читать код и публиковать сайт.
permissions:
  contents: read
  pages: write
  id-token: write

# Если запушить несколько раз подряд, старая публикация отменится
# и выполнится только последняя.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci ставит зависимости строго по package-lock.json,
      # то есть ровно тех версий, что и на твоём компьютере.
      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
